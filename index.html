<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Andalusia App — Campaign</title>
<meta name="theme-color" content="#120B06">
<link rel="icon" href="assets/el/app_icon.webp">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/sections.css">
<link rel="stylesheet" href="css/brain.css">
<script>
(function(){var q=location.search,d=document.documentElement;
if(/[?&]static=1/.test(q))d.classList.add('static');
if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)d.classList.add('calm');})();
</script>
</head>
<body>

<header class="nav glass glass-dark" id="nav">
  <a class="nav-brand" href="#hero" aria-label="Back to top"><img src="assets/el/app_icon.webp" alt="" width="30" height="30">Andalusia App <span>Campaign</span></a>
  <nav class="nav-links" id="nav-links" aria-label="Sections"></nav>
  <div class="nav-now" id="nav-now"></div>
  <i class="nav-bar" id="nav-bar"></i>
</header>
<nav class="dots" id="dots" aria-hidden="true"></nav>

<main id="main">
  <section id="hero" class="hero" data-label="Open"></section>
  <section id="idea" class="sec idea" data-label="Idea"></section>
  <section id="brain" class="brain" data-label="Network"></section>
  <section id="stories" class="stories" data-label="Stories"></section>
  <section id="visuals" class="visuals" data-label="Key visuals"></section>
  <section id="redesign" class="redesign" data-label="New design"></section>
  <section id="calendar" class="sec calendar" data-label="Calendar"></section>
  <section id="social" class="sec social" data-label="Social"></section>
  <section id="outdoor" class="sec outdoor" data-label="Outdoor"></section>
  <section id="films" class="sec films" data-label="Films"></section>
  <section id="plan" class="sec plan" data-label="Media plan"></section>
  <section id="close" class="close" data-label="Close"></section>
</main>

<div class="ov" id="lb" role="dialog" aria-modal="true" aria-label="Image viewer">
  <button class="ov-x glass" id="lb-x" aria-label="Close">&#x2715;</button>
  <button class="ov-btn prev glass" id="lb-prev" aria-label="Previous">&#x2039;</button>
  <button class="ov-btn next glass" id="lb-next" aria-label="Next">&#x203A;</button>
  <figure class="lb-fig"><img id="lb-img" alt=""><figcaption class="lb-cap"><b id="lb-n"></b><span id="lb-t"></span></figcaption></figure>
</div>
<div class="ov" id="pl" role="dialog" aria-modal="true" aria-label="Film player">
  <button class="ov-x glass" id="pl-x" aria-label="Close">&#x2715;</button>
  <div class="pl-frame glass" id="pl-frame">
    <video id="pl-video" controls playsinline preload="none"></video>
    <div class="pl-meta"><span id="pl-title"></span><span class="chip sm ember" id="pl-soon" hidden>Coming soon</span></div>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer glass glass-dark" id="drawer" aria-hidden="true" aria-label="Story rules and best posting times"></aside>

<script src="data/campaign.js"></script>
<script src="js/app.js"></script>
<script src="js/sections.js"></script>
<script src="js/brain.js"></script>
<script>APP.start();</script>
</body>
</html>
